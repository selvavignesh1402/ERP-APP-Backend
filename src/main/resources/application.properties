spring.application.name=backend

server.port=8083

# spring.datasource.url=jdbc:h2:mem:riceerpdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

spring.datasource.url=jdbc:mysql://localhost:3306/erp_db_v1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.riceerp.backend.security.TenantIdentifierResolver

# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.h2.console.settings.web-allow-others=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Seed demo data. data.sql is idempotent: reference data is re-inserted only if missing,
# and ON DUPLICATE KEY clauses never reset live quantities/amounts, so dev data survives restarts.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true



