name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode verify

  # The H2 suite cannot prove MySQL compatibility: ENUM columns, DECIMAL
  # rounding and Flyway migrations all behave differently there. This job boots
  # a real MySQL 8, applies every migration and then starts the application with
  # ddl-auto=validate, which is the configuration production is pinned to by
  # DatabaseProfileGuard. An entity/column type mismatch fails the build here
  # instead of at deployment.
  mysql-schema-validation:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_MYSQL: 'true'
      DEV_DB_URL: jdbc:mysql://127.0.0.1:3306/erp_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DEV_DB_USERNAME: root
      DEV_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode test -Dtest=MySqlSchemaValidationTest
